name: Regenerar presentacion corregida
on:
  push:
    paths:
      - '.github/workflows/regenerar-presentacion.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install --quiet python-pptx Pillow
      - name: Generar diapositivas con nombre de Sebastian
        run: python src/crear_presentacion.py
      - name: Instalar conversor PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-impress
      - name: Exportar PDF
        run: |
          libreoffice -env:UserInstallation=file:///tmp/lo_proyecto_sebastian --headless --convert-to pdf --outdir presentacion presentacion/Proyecto_Final_Analisis_Salarios.pptx
      - name: Publicar presentaciones corregidas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentacion/Proyecto_Final_Analisis_Salarios.pptx presentacion/Proyecto_Final_Analisis_Salarios.pdf
          git commit -m "Actualizar presentacion de Sebastian Manosalva Fonseca"
          git push
